{% extends "base.html" %}{% block title %}Login{% endblock %}
{% block content %}<div class="auth-card card p-4 shadow-sm mx-auto">
<h2>Welcome back 👋</h2><p class="text-muted">Login to analyze your skills.</p>
<form method="post">
<label class="form-label">Email</label><input class="form-control mb-3" name="email" type="email" required>
<label class="form-label">Password</label><input class="form-control mb-3" name="password" type="password" required>
<button class="btn btn-primary w-100">Login</button>
</form><p class="mt-3 mb-0">New user? <a href="{{ url_for('register') }}">Create account</a></p>
</div>{% endblock %}
