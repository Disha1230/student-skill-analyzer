{% extends "base.html" %}{% block title %}Profile{% endblock %}
{% block content %}<div class="card p-4"><h2>👤 Profile</h2><form method="post">
<label class="form-label">Name</label><input class="form-control mb-3" name="name" value="{{user['name']}}" required>
<label class="form-label">Email</label><input class="form-control mb-3" value="{{user['email']}}" disabled>
<label class="form-label">Education Stream</label><select class="form-select mb-3" name="education_stream"><option value="">Select stream</option>{% for x in ['Commerce','Computer Science / IT','Arts / Humanities','Science','Medical / Healthcare','Education','Design / Media','Hospitality / Travel'] %}<option {% if user['education_stream']==x %}selected{% endif %}>{{x}}</option>{% endfor %}</select>
<label class="form-label">Education / Course</label><input class="form-control mb-3" name="education" value="{{user['education']}}">
<label class="form-label">College</label><input class="form-control mb-3" name="college" value="{{user['college']}}">
<button class="btn btn-primary">Save Profile</button></form></div>{% endblock %}
